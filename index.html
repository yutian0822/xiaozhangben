<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小账本">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>小账本</title>
<style>
  :root{
    --bg:#0e1116; --bg2:#161b22; --bg3:#1d242e; --line:#262e3a;
    --fg:#e8edf4; --dim:#8b98a8; --dim2:#616e7e;
    --biz:#f0b429; --me:#4ea8ff; --ok:#3ecf8e; --warn:#ff8a5c; --bad:#ff5d5d;
    --r:14px;
    --accent:var(--biz); --glow:rgba(240,180,41,.13);
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f7f9; --bg2:#fff; --bg3:#eef1f5; --line:#e2e6ec; --fg:#161b22; --dim:#5f6b7a; --dim2:#8b98a8; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);
    color:var(--fg);
    font:16px/1.45 ui-rounded,"SF Pro Rounded","Yuanti SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    padding:env(safe-area-inset-top) 0 calc(168px + env(safe-area-inset-bottom));
    overscroll-behavior-y:none;
  }
  button,input,select{font:inherit;color:inherit}
  button{background:none;border:0;cursor:pointer}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px;position:relative;z-index:1}
  .deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
    font-size:30px;line-height:1;opacity:.45;user-select:none}
  .deco span{position:absolute;display:block;}
  body[data-ledger="me"]{--accent:var(--me); --glow:rgba(78,168,255,.13)}

  header{padding:14px 0 8px;position:sticky;top:0;z-index:5;background:var(--bg);
    -webkit-backdrop-filter:saturate(1.5) blur(14px);backdrop-filter:saturate(1.5) blur(14px)}
  @supports (background:color-mix(in srgb, red 50%, transparent)){
    header{background:color-mix(in srgb, var(--bg) 80%, transparent)}
  }
  .row{display:flex;align-items:center;justify-content:center;gap:8px;position:relative;min-height:80px}
  .brand{display:flex;align-items:center;transform:translateX(-38px)}
  .pet{height:84px;width:auto;flex:none;margin-right:-30px;
    pointer-events:none;user-select:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.55));
    animation:petbob 3.6s ease-in-out infinite}
  @keyframes petbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @media (max-width:370px){.pet{height:72px}}
  .row .iconbtn{position:absolute;right:0;top:50%;transform:translateY(-50%)}
  .title{font-size:26px;font-weight:700;letter-spacing:2px;text-align:center;
    background:linear-gradient(180deg,var(--fg),color-mix(in srgb,var(--fg) 78%,var(--accent)));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .iconbtn{width:36px;height:36px;border-radius:12px;background:var(--bg2);display:grid;place-items:center;font-size:15px;color:var(--dim)}
  .month{display:flex;align-items:center;gap:6px;margin:10px 0 12px;color:var(--dim);font-size:14px}
  .month b{color:var(--fg);font-weight:600;font-size:15px;min-width:108px;text-align:center;cursor:pointer;position:relative;padding:4px 2px}
  .month b:after{content:"";display:inline-block;width:6px;height:6px;margin-left:6px;border-right:1.5px solid var(--dim);border-bottom:1.5px solid var(--dim);transform:translateY(-2px) rotate(45deg);opacity:.7}
  .monlist .mrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer}
  .monlist .mrow:active{opacity:.6}
  .monlist .lbl{font-weight:550}
  .monlist .v{font-size:13px;color:var(--dim);text-align:right}
  .monlist .mrow.on .lbl{color:var(--accent)}
  .ybar{display:flex;align-items:center;justify-content:center;gap:14px;margin:2px 0 6px}
  .ybar b{font-size:14px;color:var(--dim);min-width:64px;text-align:center}
  .ybar button{width:30px;height:30px;border-radius:9px;color:var(--dim);font-size:16px}
  .day.flash{animation:flashDay 1.4s ease-out}
  @keyframes flashDay{0%{background:rgba(240,180,41,.14)}100%{background:transparent}}
  .crow{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line)}
  .crow .ic{font-size:16px;width:20px;text-align:center}
  .crow .mid{flex:1;min-width:0}
  .crow .nm{font-size:14px;display:flex;align-items:center;gap:8px}
  .crow .nm .t{display:flex;align-items:center;gap:8px}
  .crow .nm b{font-weight:600}
  .crow .nm i{font-style:normal;font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:0 5px;align-self:center}
  .crow .track{display:block;height:5px;border-radius:3px;background:rgba(255,255,255,.09);margin-top:7px;overflow:hidden}
  .crow .track i{display:block;height:100%;border-radius:3px;background:var(--accent)}
  .crow .v{font-size:14px;font-weight:600;white-space:nowrap}
  .monlist .mrow.cur .lbl:after{content:"本月";margin-left:8px;font-size:11px;font-weight:400;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:0 5px}
  .month button{width:30px;height:30px;border-radius:10px;font-size:16px;color:var(--dim)}
  .month .today{margin-left:auto;width:auto;white-space:nowrap;font-size:13px;color:var(--dim);background:var(--bg2);padding:5px 10px;border-radius:9px}

  .seg{display:flex;background:var(--bg3);border-radius:12px;padding:3px;gap:3px}
  .seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:14px;color:var(--dim);font-weight:550}
  .seg button.on{background:var(--bg2);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.18)}
  .seg{box-shadow:inset 0 1px 2px rgba(0,0,0,.18)}
  body[data-ledger="biz"] .seg button.on{color:var(--biz)}
  body[data-ledger="me"] .seg button.on{color:var(--me)}
  .bseg{display:flex;gap:8px;margin-top:14px}
  .bseg button{flex:1;padding:12px 6px;border-radius:12px;background:var(--bg3);font-size:14px;color:var(--dim)}
  .bseg button.on{background:var(--bg2);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--accent)}
  .imp-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:3px 0}
  .imp-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .imp-row .ct{flex:none;font-size:11px;color:var(--dim);opacity:.8;border:1px solid var(--line);border-radius:6px;padding:0 5px}
  .imp-row b{flex:none;color:var(--fg);font-weight:550}
  .imp-row{cursor:pointer}
  .imp-row.dupdeco{opacity:.42}
  .imp-row.skipped .nm{text-decoration:line-through;opacity:.5}
  .ct.dup,.ct.skip{color:var(--dim);border-color:var(--line)}
  .ct.lg.biz{color:var(--biz);border-color:rgba(240,180,41,.5)}
  .ct.lg.me{color:var(--me);border-color:rgba(78,168,255,.5)}

  .card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px}
  #summary{position:relative;overflow:hidden;
    background:linear-gradient(158deg, var(--bg3), var(--bg2) 58%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.045), 0 10px 30px -22px rgba(0,0,0,.9)}
  #summary>*{position:relative;z-index:1}
  #summary > .sub:first-child::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;
    background:var(--accent);margin-right:6px;vertical-align:2px}
  .big{font-size:30px;font-weight:680;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
  .big small{font-size:15px;font-weight:500;color:var(--dim);margin-left:4px;letter-spacing:0}
  .subs{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
  .sub{font-size:13px;color:var(--dim)}
  .sub b{display:block;font-size:15px;color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
  .sub.warn b{color:var(--warn)} .sub.ok b{color:var(--ok)}
  .hint.warn{color:var(--warn)} .hint.ok{color:var(--dim)}
  .sumall{display:flex;justify-content:space-between;gap:10px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--dim);flex-wrap:wrap}
  .sumall b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}

  .chips{display:flex;gap:8px;overflow:auto;padding:14px 0 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;padding:7px 13px;border-radius:20px;font-size:13px;background:var(--bg2);border:1px solid var(--line);color:var(--dim)}
  .chip.on{background:var(--fg);color:var(--bg);border-color:transparent;font-weight:600;box-shadow:0 3px 12px rgba(0,0,0,.22)}
  .chip{transition:background .18s,color .18s}

  .day{margin-top:16px}
  .dayhead{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--dim2);
    padding:0 2px 8px;margin-bottom:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;letter-spacing:.2px}
  .dayhead span:first-child{font-weight:550;color:var(--dim)}
  .day:first-child{margin-top:14px}
  .item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg2);border:1px solid var(--line);
    border-radius:12px;margin-bottom:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
    transition:transform .12s ease,border-color .18s}
  .item:active{transform:scale(.986);border-color:var(--dim2)}
  .item .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:15px;flex:none;
    background:linear-gradient(160deg,var(--bg3),var(--bg2));border:1px solid var(--line)}
  .item .mid{flex:1;min-width:0}
  .item .n{font-size:15px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .m{font-size:12.5px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .amt{font-size:16px;font-weight:620;font-variant-numeric:tabular-nums;white-space:nowrap}
  .pill{font-size:11px;padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:1px}
  .pill.wait{background:rgba(255,138,92,.16);color:var(--warn)}
  .pill.done{background:rgba(62,207,142,.14);color:var(--ok)}
  .pill.sent{background:rgba(78,168,255,.15);color:var(--me)}
  .empty{text-align:center;color:var(--dim2);font-size:14px;padding:46px 20px 54px;line-height:1.9}
  .empty .ico2{width:64px;height:64px;margin:0 auto 14px;border-radius:22px;display:grid;place-items:center;
    font-size:26px;color:var(--accent);background:var(--bg2);border:1px dashed var(--line)}
  .empty .t2{color:var(--fg);font-size:15px;font-weight:550}

  .fab{position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:calc(24px + env(safe-area-inset-bottom));
    width:56px;height:56px;border-radius:19px;background:var(--fg);color:var(--bg);font-size:28px;font-weight:300;
    display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:20;
    transition:transform .12s ease,box-shadow .18s}
  .fab:active{transform:scale(.93);box-shadow:0 6px 18px rgba(0,0,0,.45)}
  .scrim{position:fixed;left:0;right:0;bottom:0;height:calc(170px + env(safe-area-inset-bottom));z-index:18;pointer-events:none;
    background:linear-gradient(to top,var(--bg) 42%,rgba(0,0,0,0))}
  .barwrap{position:fixed;left:16px;right:16px;bottom:calc(94px + env(safe-area-inset-bottom));
    display:flex;gap:10px;z-index:19}
  .barbtn{flex:1;min-width:0;height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    gap:8px;font-size:15px;box-shadow:0 10px 26px rgba(0,0,0,.45);transition:transform .1s ease}
  .barbtn:active{transform:scale(.97)}
  .barbtn.say{background:linear-gradient(180deg,rgba(240,180,41,.18),rgba(240,180,41,.10)),var(--bg2);
    border:1px solid rgba(240,180,41,.45);color:var(--biz);font-weight:600}
  .barbtn.say .mi{font-size:17px;line-height:1}
  .barbtn.plus{background:var(--fg);color:var(--bg);font-weight:650}
  .barbtn.plus .pl{font-size:20px;font-weight:300;line-height:1;margin-top:-1px}
  #quickText{width:100%;min-height:92px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;
    color:var(--fg);font-size:16px;line-height:1.6;padding:12px;resize:none;font-family:inherit}
  #quickText::placeholder{color:var(--dim)}
  .qp{display:flex;justify-content:space-between;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:14px}
  .qp span{color:var(--dim)} .qp b{font-weight:550}

  .sheet{position:fixed;inset:0;z-index:30;display:none;background:rgba(0,0,0,.5);backdrop-filter:blur(3px)}
  .sheet.show{display:block}
  .panel{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:20px 20px 0 0;
    padding:calc(12px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));
    max-height:92vh;max-height:calc(100dvh - env(safe-area-inset-top) - 52px);overflow:auto;animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
  .phead{display:flex;align-items:center;justify-content:space-between;padding:6px 0 10px;min-height:44px}
  .phead button{min-height:44px;min-width:44px;display:flex;align-items:center}
  .phead b{font-size:16px}
  .phead button{font-size:15px;color:var(--dim)}
  .phead .save{color:var(--fg);font-weight:650}
  .amtrow{display:flex;align-items:center;gap:8px;padding:8px 0 14px;border-bottom:1px solid var(--line)}
  .amtrow span{font-size:26px;color:var(--dim)}
  .amtrow input{flex:1;background:none;border:0;outline:0;font-size:38px;font-weight:680;letter-spacing:-1px;font-variant-numeric:tabular-nums;min-width:0}
  .field{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}
  .field label{width:72px;flex:none;font-size:14px;color:var(--dim)}
  .field input,.field select{flex:1;background:none;border:0;outline:0;font-size:15px;text-align:right;min-width:0}
  .field select{appearance:none;text-align-last:right}
  .field input::placeholder{color:var(--dim2)}
  .danger{width:100%;margin-top:16px;padding:13px;border-radius:12px;background:rgba(255,93,93,.12);color:var(--bad);font-size:15px;font-weight:550}
  .hint{font-size:12.5px;color:var(--dim2);margin-top:10px;line-height:1.7}

  .bar{height:6px;border-radius:4px;background:var(--bg3);overflow:hidden;margin:12px 2px 6px}
  .bar i{display:block;height:100%;border-radius:4px;background:var(--accent);transition:width .3s}
  .bar.day i{background:var(--me)}
  .bar.loan i{background:#a78bfa}
  .bar.loan.over i{background:#f472b6}
  .bar.over i{background:var(--bad)}
  .barTxt{font-size:12px;color:var(--dim);display:flex;justify-content:space-between;margin:0 2px}
  .barTxt b{color:var(--fg);font-weight:550}
  .nudge{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 150px);z-index:40;
    display:none;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;
    background:linear-gradient(180deg,var(--bg3),var(--bg2));border:1px solid var(--line);
    box-shadow:0 10px 28px rgba(0,0,0,.45);font-size:13px;color:var(--fg)}
  .nudge.show{display:flex}
  .nudge span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nudge button{background:none;border:0;color:var(--accent);font-size:13px;padding:2px 4px}
  .nudge #nudgeX{color:var(--dim);font-size:17px;line-height:1}
  .toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,10px);
    background:var(--bg3);color:var(--fg);padding:10px 16px;border-radius:12px;font-size:13.5px;opacity:0;
    transition:.2s;pointer-events:none;z-index:50;border:1px solid var(--line)}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .hidden{display:none!important}
</style>
</head>

<div class="wrap">
  <header>
    <div class="row">
      <div class="brand">
        <img class="pet" src="pet.webp" alt="" aria-hidden="true">
        <div class="title">小账本</div>
      </div>
      <button class="iconbtn" id="btnSet" aria-label="设置">⚙</button>
    </div>
    <div class="month">
      <button id="prev" aria-label="上个月">‹</button>
      <b id="monthLabel" role="button" tabindex="0" aria-label="查看每月合计">—</b>
      <button id="next" aria-label="下个月">›</button>
      <button class="today" id="btnToday">回到本月</button>
    </div>
    <div class="seg">
      <button data-ledger="biz" class="on">对公垫付</button>
      <button data-ledger="me">个人生活</button>
    </div>
  </header>

  <section class="card" id="summary"></section>
  <div class="chips" id="chips"></div>
  <main id="list"></main>
</div>

<div class="scrim"></div>
<div class="barwrap">
  <button class="barbtn say" id="quickBtn" aria-label="说一句记账"><span class="mi">🎙</span>说一句</button>
  <button class="barbtn plus" id="add" aria-label="记一笔"><span class="pl">＋</span>记一笔</button>
</div>

<div class="sheet" id="quickSheet">
  <div class="panel">
    <div class="phead"><button id="quickClose">取消</button><b>说一句</b><span style="width:44px"></span></div>

    me:['吃饭','饮品','超市','交通','日用','娱乐','医疗','宠物','孩子','人情','房租水电','还款还贷','其他']
  };
  var ICONS={'交通':'🚕','餐饮':'🍜','饮品':'☕','超市':'🛒','住宿':'🏨','办公用品':'📎','招待':'🍽','快递':'📦','会务':'🎤','其他':'•','还款还贷':'🏦',
    '吃饭':'🍚','日用':'🧴','娱乐':'🎬','医疗':'💊','宠物':'🐾','孩子':'🎒','人情':'🎁','房租水电':'🏠'};
  var S={ledger:'biz',offset:0,filter:'全部',entries:[],editId:null};

  function $(s){return document.querySelector(s)}
  function pad(n){return n<10?'0'+n:''+n}
  function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function monthOf(offset){var d=new Date();d.setDate(1);d.setMonth(d.getMonth()+offset);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
  function money(n){return (Math.round(n*100)/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

  function 规范条目(e){
    if(!e||typeof e!=='object')return null;
    var lg=e.ledger==='biz'?'biz':'me';
    var d=String(e.date==null?'':e.date).trim().slice(0,10).replace(/\//g,'-');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d))d=todayStr();
    var amt=Math.abs(parseFloat(e.amount));
    if(!isFinite(amt))amt=0;
    return {
      id:(typeof e.id==='string'&&/^[A-Za-z0-9_-]{1,40}$/.test(e.id))?e.id:uid(),
      ledger:lg,amount:Math.round(amt*100)/100,date:d,
      category:CATS[lg].indexOf(e.category)>=0?e.category:CATS[lg][0],note:String(e.note==null?'':e.note),
      project:String(e.project==null?'':e.project),invoice:String(e.invoice==null?'':e.invoice),
      status:lg==='biz'?(e.status==='已提交'||e.status==='已到账'?e.status:'待报'):'',
      pay:String(e.pay==null?'':e.pay),ext:String(e.ext==null?'':e.ext),
      hash:String(e.hash==null?'':e.hash),createdAt:+e.createdAt||0
    };
  }
  function load(){
    var raw=null;
    try{raw=localStorage.getItem(KEY)}catch(e){}
    if(!raw)return;
    var list=[];
    try{var o=JSON.parse(raw);if(o&&Array.isArray(o.entries))list=o.entries}catch(e){return}
    /* 兜底：老版本/导入的数据可能缺字段或类型不对，先补齐再渲染，免得一开就报错 */
    S.entries=list.map(规范条目).filter(Boolean);
  }
  function save(){
    try{localStorage.setItem(KEY,JSON.stringify({v:1,entries:S.entries}))}catch(e){toast('保存失败：存储空间不够')}
    try{查预算()}catch(e){}
  }

    $('#askSheet').classList.add('show');
  }

    var coinBuf=null,coinBusy=false,coinPending=0;
    function 放硬币(a){
      if(!coinBuf)return false;
      /* iOS 回前台/锁屏后 AudioContext 常常是 suspended，resume 是异步的：
         等它真的 running 了再放，否则这一次就是静音播完。 */
      if(a.state!=='running'){try{a.resume().then(function(){放硬币(a)}).catch(function(){})}catch(e){} return true}
      try{
        var src=a.createBufferSource();src.buffer=coinBuf;
        var g=a.createGain();g.gain.value=0.65;    /* 原声的 65%：10% + 10% + 15% */
        src.connect(g);g.connect(a.destination);src.start(a.currentTime+0.01);
      }catch(e){return false}
      return true;
    }
    function 装硬币(a){
      if(!a||coinBuf||coinBusy||!COIN)return;
      coinBusy=true;
      try{
        var bin=atob(COIN),u8=new Uint8Array(bin.length);
        for(var i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
        a.decodeAudioData(u8.buffer,function(b){coinBuf=b;coinBusy=false;if(coinPending){coinPending=0;放硬币(ac)}},function(){coinBusy=false});
      }catch(e){coinBusy=false}
    }
    var on=(localStorage.getItem(KEY)||'1')==='1';
    function ctx(){
      if(!on)return null;
      try{
        if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ac=new C()}
        if(ac.state!=='running'){try{ac.resume()}catch(e){}}
        return ac;
      }catch(e){return null}
    }
    function tone(a,f,dur,vol,type,delay,dest){
      var t=a.currentTime+(delay||0);
      var o=a.createOscillator(),g=a.createGain();
      o.type=type||'sine';o.frequency.setValueAtTime(f,t);
      o.detune.setValueAtTime((Math.random()-.5)*6,t);
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(vol,t+0.006);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g);g.connect(dest||a.destination);o.start(t);o.stop(t+dur+0.04);
    }
    return {
      save:function(){var a=ctx();if(!a)return;
        tone(a,1318.5,0.26,0.085,'sine',0);
        tone(a,1760.0,0.30,0.070,'sine',0.06);
        tone(a,2637.0,0.18,0.030,'sine',0.06);},
      paid:function(){
        var a=ctx();if(!a)return;
        if(!放硬币(a)){coinPending=1;装硬币(a)}   /* 第一次还没解码完，解完自动补放 */
      },
      del:function(){var a=ctx();if(!a)return;
        tone(a,220,0.20,0.070,'triangle',0);
        tone(a,165,0.24,0.055,'triangle',0.05);},
      unlock:function(){var a=ctx();if(a){装硬币(a);if(a.state!=='running'){try{a.resume()}catch(e){}}}},
      isOn:function(){return on},
      set:function(v){on=!!v;try{localStorage.setItem(KEY,on?'1':'0')}catch(e){}},
      toggle:function(){on=!on;try{localStorage.setItem(KEY,on?'1':'0')}catch(e){}return on}
    };
  })();

  /* ── 每月预算（只作用于个人生活） ── */
  var BGK='xiaozhangben.budget';
  function 读预算(){
    try{ var v=JSON.parse(localStorage.getItem(BGK)||'null');
      if(v&&typeof v==='object') return {limit:+v.limit||0, loan:+v.loan||0, pct:+v.pct||80, warned:v.warned||''};
    }catch(e){}
    return {limit:0,loan:0,pct:80,warned:''};
  }
  function 存预算(v){ try{ localStorage.setItem(BGK,JSON.stringify(v)) }catch(e){} }
  function 本月个人分项(){
    var m=monthOf(0),day=0,loan=0;
    S.entries.forEach(function(e){
      if(e.ledger!=='me'||String(e.date||'').slice(0,7)!==m)return;
      if(e.category==='还款还贷')loan+=e.amount; else day+=e.amount;
    });
    return {day:day,loan:loan};
  }
  function 查预算(){
    var b=读预算(); if(b.limit<=0&&b.loan<=0)return;
    var 项=本月个人分项(), m0=monthOf(0);
    function 一档(名字,used,limit,slug){
      if(limit<=0)return;
      var p=used/limit*100, key=m0+'|'+b.pct+'|'+slug;
      if(p<b.pct||b.warned===key)return;
      b.warned=key;
      if(used>limit) toast(名字+'超了 ¥'+money(used-limit));
      else if(p>=100) toast(名字+'用完了');
      else toast(名字+'花到 '+Math.round(p)+'%，还剩 ¥'+money(limit-used));
    }
    一档('这个月日常预算',项.day,b.limit,'d');
    一档('这个月还款预算',项.loan,b.loan,'l');
    存预算(b);
  }

  /* ── 每日提醒 ── */
  var RM='xiaozhangben.remind';
  function rmLoad(){
    try{ var v=JSON.parse(localStorage.getItem(RM)||'null'); if(v&&typeof v==='object')
      return {on:v.on!==false, h:typeof v.h==='number'?v.h:21, m:typeof v.m==='number'?v.m:0, day:v.day||''};
    }catch(e){}
    return {on:true,h:21,m:0,day:''};
  }
  function rmSave(v){ try{ localStorage.setItem(RM,JSON.stringify(v)) }catch(e){} }
  function rmPaint(){
    var r=rmLoad();
    var b=$('#rmBtn'); if(b){ b.textContent=r.on?'开':'关'; b.style.color=r.on?'var(--me)':'var(--dim)' }
    var t=$('#rmTime'); if(t) t.value=('0'+r.h).slice(-2)+':'+('0'+r.m).slice(-2);
    var nb=$('#notifyBtn');
    if(nb){
      var p=(typeof Notification!=='undefined')?Notification.permission:'none';
      nb.textContent=p==='granted'?'已开':(p==='denied'?'被拒':'开启');
      nb.style.color=p==='granted'?'var(--ok)':'var(--me)';
    }
  }
  function 今天记过没(){
    var t=todayStr();
    return S.entries.some(function(e){ return e.date===t });
  }
  function rmNotify(){
    if(typeof Notification==='undefined')return;
    if(Notification.permission!=='granted')return;
    try{
      if(navigator.serviceWorker&&navigator.serviceWorker.ready){
        navigator.serviceWorker.ready.then(function(reg){
          reg.showNotification('今天还没记账',{body:'记一笔，别攒到月底', icon:'icons/icon-192.png', tag:'xiaozhangben-daily'});
        });
      }
    }catch(e){}
  }
  function rmCheck(){
    var r=rmLoad();
    if(!r.on)return;
    if($('#nudge').classList.contains('show'))return;
    if(今天记过没())return;
    if(r.day===todayStr())return;                 /* 今天已经提醒过 */
    var d=new Date();
    if(d.getHours()*60+d.getMinutes() < r.h*60+r.m)return;
    $('#nudge').classList.add('show');
    rmSave({on:r.on,h:r.h,m:r.m,day:todayStr()});
    rmNotify();
  }
  function rmIcs(){
    var r=rmLoad();
    var d=new Date(); d.setDate(d.getDate()+1);
    var ymd=d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2);
    var hm=('0'+r.h).slice(-2)+('0'+r.m).slice(-2)+'00';
    var ics=[
      'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//xiaozhangben//CN','CALSCALE:GREGORIAN',
      'BEGIN:VEVENT','UID:xiaozhangben-'+ymd+'@local','DTSTAMP:'+ymd+'T'+hm+'Z',
      'DTSTART;TZID=Asia/Shanghai:'+ymd+'T'+hm,
      'RRULE:FREQ=DAILY',
      'SUMMARY:记一笔账',
      'DESCRIPTION:打开小账本，把今天的账记上。',
      'END:VEVENT','END:VCALENDAR'
    ].join('\r\n');
    var blob=new Blob([ics],{type:'text/calendar'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='小账本-每日提醒.ics';
    document.body.appendChild(a); a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},4000);
    toast('日历文件已导出，打开它就能加进日历');
  }

  function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show')},1900)}

  function monthEntries(){var m=monthOf(S.offset);return S.entries.filter(function(e){return String(e.date||'').slice(0,7)===m})}
  function visible(){
    var arr=monthEntries().filter(function(e){return e.ledger===S.ledger});
    if(S.ledger==='biz'&&S.filter!=='全部')arr=arr.filter(function(e){return (e.status||'待报')===S.filter});
    return arr.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(b.createdAt||0)-(a.createdAt||0)});
  }

  function render(){
    var m=monthOf(S.offset);
    var y=+m.slice(0,4),mo=+m.slice(5,7);
    $('#monthLabel').textContent=y+'年'+mo+'月';
    document.body.dataset.ledger=S.ledger;
  
  document.querySelectorAll('.seg button').forEach(function(b){b.classList.toggle('on',b.dataset.ledger===S.ledger)});
    renderSummary();renderChips();renderList();
  }

  function budgetHtml(){
    var b=读预算();
    if(b.limit<=0&&b.loan<=0)return '';
    var 项=本月个人分项();
    function 一条(名字,used,limit,cls){
      if(limit<=0)return '';
      var p=used/limit*100, over=used>limit;

  function download(name,text,mime){
    try{
      var blob=new Blob([text],{type:mime||'text/plain;charset=utf-8'});
      var file=new File([blob],name,{type:mime||'text/plain'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        navigator.share({files:[file],title:name}).catch(function(){});
        return;
      }
      var url=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=url;a.download=name;document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(url);a.remove()},1500);
      toast('已导出 '+name);

  function splitCsv(line,d){
    d=d||',';
    var out=[],cur='',q=false;
    for(var i=0;i<line.length;i++){
      var c=line[i];
      if(q){
        if(c==='"'){ if(line[i+1]==='"'){cur+='"';i++} else q=false }
        else cur+=c;
      }else{
        if(c==='"')q=true;
        else if(c===d){out.push(cur);cur=''}
        else cur+=c;
      }
    }
    out.push(cur);return out;
  }
  function pick(headers,words){
    for(var i=0;i<headers.length;i++){
      var h=headers[i];
      for(var j=0;j<words.length;j++){ if(h.indexOf(words[j])>=0) return i }
    }
    return -1;
  }
  function guessCat(text,ledger){

    if(has('咖啡','奶茶','拿铁','星巴克','瑞幸','喜茶','霸王茶姬','茶百道','蜜雪','柠檬茶','果茶','奶盖','气泡水','白酒','啤酒','酒吧','清吧','茶馆','饮品'))return '饮品';
    if(has('猫粮','狗粮','宠物','猫砂','驱虫','绝育','兽医','宠物医院','寄养'))return ledger==='biz'?'其他':'宠物';
    if(has('餐','饭','美团','饿了么','面包','面馆','食'))return ledger==='biz'?'餐饮':'吃饭';
    if(has('打车','滴滴','出租','地铁','公交','高铁','动车','机票','机场','加油','停车','车费'))return '交通';
    if(has('超市','便利店','沃尔玛','永辉','盒马','大润发','华润','联华','罗森','全家','物美','生鲜','菜场','菜场','山姆','costco'))return '超市';
    if(has('京东','淘宝','拼多多','购物','日用品','网购'))return ledger==='biz'?'办公用品':'日用';
    if(has('药店','医院','药'))return ledger==='biz'?'其他':'医疗';
    if(has('电影','游戏','娱乐','KTV'))return ledger==='biz'?'招待':'娱乐';
    if(has('绘本','玩具','书包','文具','幼儿园','儿童','宝宝'))return ledger==='biz'?'其他':'孩子';
    if(has('花束','鲜花','礼物','红包','随礼'))return ledger==='biz'?'招待':'人情';
    if(has('还款','还贷','房贷','车贷','月供','贷款','分期','信用卡还款','花呗还款','借呗'))return ledger==='biz'?'其他':'还款还贷';
    if(has('快递','顺丰','邮'))return ledger==='biz'?'快递':'其他';

  function parseBillMatrix(rows){
    /* 微信、支付宝、各家银行导出的表头写法都不一样，前头还常带几行说明。
       不靠固定字眼，给每行打分，分最高、且同时有金额和时间的那行当表头。 */
    var KEY=[['金额',4],['收/支',3],['收支',3],['交易时间',3],['付款时间',3],['创建时间',3],
      ['时间',1],['日期',2],['交易对方',3],['对方',1],['商品',2],['说明',2],['支付方式',2],
      ['付款方式',2],['订单号',2],['交易单号',2],['商户单号',2],['交易状态',1],['类型',1],['备注',1]];
    function 打分(cells){
      var j='|'+cells.join('|')+'|',sc=0,hasAmt=false,hasTime=false;
      for(var i=0;i<KEY.length;i++){
        if(j.indexOf(KEY[i][0])>=0){
          sc+=KEY[i][1];
          if(KEY[i][0]==='金额')hasAmt=true;
          if(KEY[i][0]==='时间'||KEY[i][0]==='日期')hasTime=true;
        }
      }
      return {sc:sc,ok:hasAmt&&hasTime};
    }
    var hi=-1,best=0,headers=[];
    for(var i=0;i<Math.min(rows.length,400);i++){
      var cells=(rows[i]||[]).map(净);
      if(cells.join('').length<4)continue;
      var r=打分(cells);
      if(r.ok&&r.sc>best){best=r.sc;hi=i;headers=cells}
    }
    if(hi<0)throw new Error('没认出表头：这份文件里找不到同时含「金额」和时间的那一行');
    var cDate=pick(headers,['交易时间','付款时间','交易创建时间','创建时间','时间','日期']);
    var cAmt=pick(headers,['金额']);
    var cDir=pick(headers,['收/支','收支']);
    var cParty=pick(headers,['交易对方','对方','商户名称','商户']);
    var cGoods=pick(headers,['商品说明','商品名称','商品','说明','摘要','用途']);
    var cNote=pick(headers,['备注','摘要','用途']);
    var cPay=pick(headers,['收/付款方式','支付方式','付款方式','付款','账户','付款账户']);
    var cId=pick(headers,['交易订单号','交易单号','订单号','交易号']);
    var cType=pick(headers,['交易分类','分类','交易类型','类型']);
    if(cAmt<0||cDate<0)throw new Error('表头认出来了，但缺「金额」或时间那一列：'+headers.slice(0,6).join(' / '));
    var head=headers.join('|');
    var source=(head.indexOf('收/付款方式')>=0||head.indexOf('交易订单号')>=0)?'支付宝':((head.indexOf('当前状态')>=0||head.indexOf('商户单号')>=0)?'微信':'支付宝');
    function normPay(raw){
      var s=净(raw);
      if(/微信|零钱|零钱通/.test(s))return '微信';
      if(/支付宝|余额宝|花呗/.test(s))return '支付宝';
      if(/银行|信用卡|储蓄卡|招商|工商|建设|农业|交通银行|中国银行|浦发|中信|民生|兴业|光大|平安/.test(s))return '银行卡';
      if(/现金/.test(s))return '现金';
      return source;
    }
    function 日期(s){
      var raw=净(s);
      /* 微信导出的 xlsx 把时间存成 Excel 序列号（如 46342.33578703704） */
      if(/^\d{4,6}(\.\d+)?$/.test(raw)){
        var ms=Math.round(parseFloat(raw)*86400000)+Date.UTC(1899,11,30);
        var d=new Date(ms);
        if(!isNaN(d.getTime()))return d.getUTCFullYear()+'-'+('0'+(d.getUTCMonth()+1)).slice(-2)+'-'+('0'+d.getUTCDate()).slice(-2);
      }
      var m=/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/.exec(raw);
      if(!m)return '';
      return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);
    }
    var out=[];
    for(var k=hi+1;k<rows.length;k++){
      var f=(rows[k]||[]).map(净);
      if(!f.join('').trim())continue;
      var dir=cDir>=0?(f[cDir]||''):'';
      /* 微信的「中性交易」（信用卡还款/充值/提现）收支列是 /，不算花销 */
      if(dir.indexOf('收入')>=0||dir.indexOf('不计')>=0||dir.indexOf('中性')>=0)continue;
      if(dir==='/'||dir==='')continue;
      var rawCell=(f[cAmt]||'').replace(/[¥￥,\s元]/g,'');
      if(!rawCell||!/^-?\d+(\.\d+)?$/.test(rawCell))continue;
      var amt=Math.abs(parseFloat(rawCell));
      var date=日期(f[cDate]);
      if(!(amt>0)||!date)continue;
      var goods=cGoods>=0?(f[cGoods]||''):'';
      var party=cParty>=0?(f[cParty]||''):'';
      var kind=cType>=0?(f[cType]||''):'';
      var 备注=cNote>=0?(f[cNote]||''):'';
      /* 微信的「商品」列经常是 / ，这时用交易对方更像人话 */
      function 有用(s){
        var v=String(s||'').trim();
        if(!v||v==='/'||v==='-'||v==='无'||v==='—'||v==='--')return false;
        if(/^[0-9A-Fa-f]{10,}$/.test(v))return false;   /* 微信有时把内部单号塞进「商品」列 */
        return true;
      }
      var note=(有用(goods)?goods:(有用(party)?party:(有用(备注)?备注:(有用(kind)?kind:'')))).trim();
      out.push({
        date:date,amount:Math.round(amt*100)/100,
        note:note.slice(0,40),kind:kind,party:party,
        pay:normPay(cPay>=0?f[cPay]:''),
        ext:cId>=0?(f[cId]||''):'',
        hash:date+'|'+amt+'|'+(note||goods||party).slice(0,16)
      });
    }
    return out;
  }

  function parseBill(text){
    var lines=text.replace(/\r\n?/g,'\n').split('\n');
    /* 支付宝的前几行说明文字里也有逗号分号，所以不能靠前几行猜分隔符：
       三种都试一遍，谁解出来的支出记录多就用谁。 */
    var seps=[',','\t',';'],best=null,headerSeen=false,firstErr=null;
    for(var s=0;s<seps.length;s++){
      var rows=lines.map(function(x){return splitCsv(x,seps[s])}).filter(function(r){return r.join('').trim()!==''});
      try{
        var out=parseBillMatrix(rows);
        headerSeen=true;
        if(!best||out.length>best.out.length)best={out:out};
      }catch(e){ if(!firstErr)firstErr=e }
    }
    if(best&&best.out.length)return best.out;
    if(!headerSeen&&firstErr)throw firstErr;
    if(headerSeen)throw new Error('表头认出来了，但里面没有支出记录（可能全是收入或「不计收支」）');
    throw new Error('没认出表头：这份文件里找不到同时含「金额」和时间的那一行');
  }

  /* ---------- 直接读 xlsx（zip + sheet xml） ---------- */
  async function inflateRaw(u8){
    if(typeof DecompressionStream==='undefined')throw new Error('这台设备不支持直接读 xlsx，请另存为 CSV');
    var st=new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(st).arrayBuffer());
  }
  async function unzipWanted(buf,wanted){
    var dv=new DataView(buf),u8=new Uint8Array(buf),eocd=-1;
    for(var i=u8.length-22;i>=Math.max(0,u8.length-22-65558);i--){
      if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}
    }
    if(eocd<0)throw new Error('不是有效的 xlsx 文件');
    var count=dv.getUint16(eocd+10,true),off=dv.getUint32(eocd+16,true),out={};
    for(var n=0;n<count;n++){
      if(off+46>u8.length||dv.getUint32(off,true)!==0x02014b50)break;
      var method=dv.getUint16(off+10,true),csize=dv.getUint32(off+20,true);
      var nlen=dv.getUint16(off+28,true),elen=dv.getUint16(off+30,true),clen=dv.getUint16(off+32,true);
      var lho=dv.getUint32(off+42,true);
      var name=new TextDecoder('utf-8').decode(u8.subarray(off+46,off+46+nlen));
      if(wanted(name)){
        var ln=dv.getUint16(lho+26,true),le=dv.getUint16(lho+28,true);
        var ds=lho+30+ln+le;
        var comp=u8.subarray(ds,ds+csize);
        out[name]=method===0?comp:await inflateRaw(comp);
      }
      off+=46+nlen+elen+clen;
    }
    return out;
  }
  function colIndex(ref){
    var s=String(ref||'').replace(/[0-9]/g,''),n=0;
    for(var i=0;i<s.length;i++)n=n*26+(s.charCodeAt(i)-64);
    return n-1;
  }
  function xlsxUnescape(v){
    return String(v).replace(/&#x([0-9a-fA-F]+);/g,function(_,h){return String.fromCodePoint(parseInt(h,16))})
      .replace(/&#(\d+);/g,function(_,d){return String.fromCodePoint(parseInt(d,10))})
      .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')
      .replace(/&apos;/g,"'").replace(/&amp;/g,'&');
  }
  function xlsxRows(xml,shared){
    var out=[],rowRe=/<row\b[^>]*>([\s\S]*?)<\/row>/g,m;
    
    while((m=rowRe.exec(xml))){
      var body=m[1]||'',arr=[],cRe=/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g,cm;
      while((cm=cRe.exec(body))){
        var attrs=cm[1]||'',inner=cm[2]||'';
        var ref=(/r="([A-Z]+)\d*"/.exec(attrs)||[])[1]||'';
        var t=(/\bt="([^"]+)"/.exec(attrs)||[])[1]||'';
        var idx=ref?colIndex(ref):arr.length;
        var v='',vm;
        if(t==='s'){ vm=/<v>([\s\S]*?)<\/v>/.exec(inner); v=vm?(shared[parseInt(vm[1],10)]||''):'' }
        else if(t==='inlineStr'){ v=xlsxUnescape(inner.replace(/<[^>]+>/g,'')) }
        else { vm=/<v>([\s\S]*?)<\/v>/.exec(inner); v=vm?xlsxUnescape(vm[1]):'' }
        arr[idx]=v;
      }
      for(var z=0;z<arr.length;z++)if(arr[z]===undefined)arr[z]='';
      out.push(arr);
    }
    return out;
  }
  async function xlsxToRows(buf){
    var zip=await unzipWanted(buf,function(n){
      return n==='xl/sharedStrings.xml'||/^xl\/worksheets\/sheet\d*\.xml$/.test(n);
    });
    var shared=[];
    if(zip['xl/sharedStrings.xml']){
      var sxml=new TextDecoder('utf-8').decode(zip['xl/sharedStrings.xml']),siRe=/<si\b[^>]*>([\s\S]*?)<\/si>/g,sm,tRe=/<t\b[^>]*>([\s\S]*?)<\/t>/g;
      while((sm=siRe.exec(sxml))){
        var txt='',tm;
        while((tm=tRe.exec(sm[1])))txt+=tm[1];
        shared.push(xlsxUnescape(txt));
      }
    }
    var key=Object.keys(zip).filter(function(n){return /worksheets\/sheet\d*\.xml$/.test(n)}).sort()[0];
    if(!key)throw new Error('xlsx 里没找到工作表');
    return xlsxRows(new TextDecoder('utf-8').decode(zip[key]),shared);
  }

  function decodeBytes(buf){
    try{ return new TextDecoder('utf-8',{fatal:true}).decode(buf) }
    catch(e){
      try{ return new TextDecoder('gbk').decode(buf) }
      catch(e2){ return new TextDecoder('utf-8').decode(buf) }
    }
  }
  function readBill(file){
    var r=new FileReader();
    r.onload=async function(){
      try{
        var buf=r.result,u8=new Uint8Array(buf);
        var isZip=u8.length>2&&u8[0]===0x50&&u8[1]===0x4b;
        var rows;
        if(isZip){
          showToastWait('正在读文件…');
          /* 支付宝网页版导出的是压缩包，里面装着一个 csv */
          var zip=null;
          try{ zip=await unzipWanted(buf,function(n){return /.csv$/i.test(n)||n==='xl/sharedStrings.xml'||/^xl\/worksheets\/sheet\d*\.xml$/.test(n)}) }catch(e){}
          var csvKey=zip?Object.keys(zip).filter(function(n){return /\.csv$/i.test(n)})[0]:'';
          if(csvKey){ rows=parseBill(decodeBytes(zip[csvKey])) }
          else { var matrix=await xlsxToRows(buf); rows=parseBillMatrix(matrix) }
        }else{
          rows=parseBill(decodeBytes(u8));
        }
        if(!rows.length){toast('没找到支出记录');return}
        showBillRows(rows);
      }catch(err){
        toast('读不出来：'+err.message);
      }
    };
    r.readAsArrayBuffer(file);
  }

  function 抓金额(s){
    var re=/(\d+(?:\.\d{1,2})?)\s*(?:元|块钱|块)/g,m,best=null;
    while((m=re.exec(s))){var v=+m[1];if(v>0&&(best===null||v>best))best=v}
    if(best!==null)return best;
    var t=s.replace(/\d{4}[-/.]\d{1,2}[-/.]\d{1,2}/g,' ').replace(/\d{1,2}月\d{1,2}[日号]/g,' ');
    re=/(\d+(?:\.\d{1,2})?)/g;var arr=[];
    while((m=re.exec(t)))arr.push(+m[1]);
    if(!arr.length)return 0;
    return Math.max.apply(null,arr);
  }
  function 抓日期(s){
    var d=new Date();
    function fmt(x){return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate())}
    if(/前天/.test(s)){d.setDate(d.getDate()-2);return fmt(d)}
    if(/昨天|昨晚/.test(s)){d.setDate(d.getDate()-1);return fmt(d)}
    if(/今天|刚刚|刚才/.test(s))return fmt(d);
    var m=s.match(/(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
    if(m)return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
    m=s.match(/(\d{1,2})月(\d{1,2})[日号]/);
    if(m){var y=d.getFullYear();if(+m[1]>d.getMonth()+1)y--;return y+'-'+pad(+m[1])+'-'+pad(+m[2])}
    return fmt(d);
  }
  function 解析一句(t){
    var s=String(t||'').trim();
    if(!s)return null;
    var bizHint=/对公|垫付|报销|客户|招待|出差|发票|项目|公司|会务/.test(s);
    var meHint=/个人|家里|家用|生活|孩子|女儿|儿子|老婆|老公|自己|零食|日用品/.test(s);
    var lg=bizHint?'biz':(meHint?'me':S.ledger);
    if(bizHint&&meHint)lg=S.ledger;
    var famHint=/老婆|老公|女儿|儿子|孩子|宝宝|爸|妈|父母|家人|家里|岳母|丈母娘|媳妇|太太/.test(s);
    if(famHint)lg='me';
    else if(/垫付/.test(s))lg='biz';
    var cat=定分类(s,'',lg);
    if(CATS[lg].indexOf(cat)<0)cat=CATS[lg][0];
    var pay=/花呗/.test(s)?'花呗':(/信用卡/.test(s)?'信用卡':(/现金/.test(s)?'现金':(/支付宝|余额宝/.test(s)?'支付宝':(/银行|储蓄卡|借记卡/.test(s)?'银行卡':'微信'))));
    var pr=(s.match(/([^\s，,。；;]{2,10}项目)/)||[])[1]||'';
    var st=/已到账|已报销|到账了/.test(s)?'已到账':(/已提交|提交了/.test(s)?'已提交':'待报');
    var inv=/专票|专用发票/.test(s)?'专票':(/普票|普通发票/.test(s)?'普票':'无');
    var amt=抓金额(s);
    var unit=new RegExp((amt?String(amt).replace('.','\\.'):'')+'\\s*(?:元|块钱|块)?','g');
    var note=s.replace(/\d+(?:\.\d{1,2})?\s*(?:元|块钱|块)/g,' ')
      .replace(amt?new RegExp(String(amt).replace('.','\\.')+'\\s*(?:元|块钱|块)?'):/^$/,' ')
      .replace(/今天|昨天|昨晚|前天|刚刚|刚才/g,' ')
      .replace(/微信|支付宝|花呗|信用卡|现金|银行卡|余额宝|\d{1,2}月\d{1,2}[日号]/g,' ')
      .replace(/[，,。；;、\s]+/g,' ').trim();
    if(note.length>22)note=note.slice(0,22);
    return {ledger:lg,amount:抓金额(s),date:抓日期(s),category:cat,note:note||cat,project:pr,invoice:inv,status:st,pay:pay};
  }
  function 显示解析(d){
    待存=d;
    $('#quickPrev').innerHTML=
      '<div class="qp"><span>金额</span><b>¥'+money(d.amount)+'</b></div>'+
      '<div class="qp"><span>日期</span><b>'+d.date+'</b></div>'+
      '<div class="qp"><span>账本</span><b>'+(d.ledger==='biz'?'对公垫付':'个人生活')+'</b></div>'+
      '<div class="qp"><span>分类</span><b>'+esc(d.category)+'</b></div>'+
      '<div class="qp"><span>用途</span><b>'+esc(d.note)+'</b></div>'+
      (d.ledger==='biz'?('<div class="qp"><span>项目 / 发票 / 状态</span><b>'+esc(d.project||'—')+' · '+esc(d.invoice)+' · '+esc(d.status)+'</b></div>'):'')+
      '<div class="qp"><span>支付</span><b>'+esc(d.pay)+'</b></div>';
    $('#quickSave').style.display='block';
  }
  $('#quickBtn').onclick=function(){
    待存=null;$('#quickText').value='';$('#quickPrev').innerHTML='';$('#quickSave').style.display='none';
    $('#quickSheet').classList.add('show');
    setTimeout(function(){$('#quickText').focus()},150);
  };
  $('#quickClose').onclick=function(){$('#quickSheet').classList.remove('show')};
  $('#quickSheet').addEventListener('click',function(e){if(e.target===$('#quickSheet'))$('#quickSheet').classList.remove('show')});
  $('#quickParse').onclick=function(){
    var d=解析一句($('#quickText').value);
    if(!d){toast('先说一句吧');return}
    if(!(d.amount>0)){toast('没听出金额，说清楚多少');return}
    显示解析(d);
  };
  $('#quickSave').onclick=function(){
    if(!待存)return;
    var e=规范条目(Object.assign({},待存,{id:uid(),createdAt:Date.now()}));
    if(!e){toast('这笔没存上');return}
    S.entries.push(e);save();
    S.offset=monthDiff(e.date.slice(0,7)+'-01');
    $('#quickSheet').classList.remove('show');
    render();toast('记好了：¥'+money(e.amount)+' '+e.category);Snd.save();
  };
  $('#add').onclick=function(){
    if(S.ledger==='biz'&&S.filter==='已提交'){openPick('已提交','待报');return}
    if(S.ledger==='biz'&&S.filter==='已到账'){openPick('已到账','已提交');return}
    openForm(null);
  };
  $('#cancel').onclick=closeForm;
  var saveBtn=$('#save'),lastSaveTap=0;
  function onSaveTap(ev){
    var now=Date.now();
    if(now-lastSaveTap<600)return;
    lastSaveTap=now;
    if(ev&&ev.type==='touchend'&&ev.cancelable)ev.preventDefault();
    saveEntry();
  }
  saveBtn.addEventListener('touchend',onSaveTap,{passive:false});
  saveBtn.addEventListener('click',onSaveTap);
  $('#btnDel').onclick=delEntry;
  $('#sheet').addEventListener('click',function(e){if(e.target===$('#sheet'))closeForm()});
  $('#chips').addEventListener('click',function(e){
    var b=e.target.closest('.chip');if(!b)return;S.filter=b.dataset.f;render();
  });
  $('#list').addEventListener('click',function(e){
    var it=e.target.closest('.item');if(!it)return;
    var en=S.entries.find(function(x){return x.id===it.dataset.id});
    if(en)openForm(en);
  });
  $('#btnSet').onclick=function(){
    $('#stat').textContent='共 '+S.entries.length+' 笔记录。数据保存在这台设备的浏览器里，不上传。';
    paintBackup();
    $('#setSheet').classList.add('show');
  };
  $('#setClose').onclick=function(){$('#setSheet').classList.remove('show')};
  function paintSnd(){var b=$('#sndBtn');b.textContent=Snd.isOn()?'开':'关';b.style.color=Snd.isOn()?'var(--me)':'var(--dim2)'}
  paintSnd();
  $('#sndBtn').onclick=function(){Snd.toggle();paintSnd();if(Snd.isOn())Snd.save();};
  $('#setSheet').addEventListener('click',function(e){if(e.target===$('#setSheet'))$('#setSheet').classList.remove('show')});
  function paintBudget(){
    var b=读预算();
    var l=$('#bgLimit'); if(l)l.value=b.limit?String(b.limit):'';
    var lo=$('#bgLoan'); if(lo)lo.value=b.loan?String(b.loan):'';
    var p=$('#bgPct'); if(p)p.value=String(b.pct||80);
  }
  paintBudget();
  $('#bgLimit').onchange=function(){
    var b=读预算();
    var v=parseFloat(this.value);
    b.limit=(isFinite(v)&&v>0)?Math.round(v*100)/100:0;
    b.warned='';存预算(b);paintBudget();render();
  };
  $('#bgLoan').onchange=function(){
    var b=读预算();var v=parseFloat(this.value);
    b.loan=(isFinite(v)&&v>0)?Math.round(v*100)/100:0;
    b.warned='';存预算(b);paintBudget();render();
  };
  $('#bgPct').onchange=function(){
    var b=读预算();
    var v=parseInt(this.value,10);
    b.pct=(isFinite(v)&&v>=1&&v<=100)?v:80;
    b.warned='';存预算(b);paintBudget();render();
  };
  rmPaint();
  $('#rmBtn').onclick=function(){var r=rmLoad();r.on=!r.on;r.day='';rmSave(r);rmPaint();toast(r.on?'每天到点提醒你记账':'提醒已关')};
  $('#rmTime').onchange=function(){
    var v=(this.value||'21:00').split(':');
    var r=rmLoad();r.h=parseInt(v[0],10)||0;r.m=parseInt(v[1],10)||0;r.day='';rmSave(r);rmPaint();
  };
  $('#notifyBtn').onclick=function(){
    if(typeof Notification==='undefined'){toast('这个浏览器不支持系统通知');return}
    Notification.requestPermission().then(function(p){rmPaint();toast(p==='granted'?'系统通知已开启':'没拿到通知权限')});
  };
  $('#icsBtn').onclick=rmIcs;
  $('#nudgeGo').onclick=function(){$('#nudge').classList.remove('show');openForm()};
  $('#nudgeX').onclick=function(){$('#nudge').classList.remove('show')};
  setInterval(rmCheck,30000);
  setTimeout(rmCheck,1200);
  $('#expCsv').onclick=function(){expCsv(false)};
  $('#expCsvAll').onclick=function(){expCsv(true)};
  $('#expJson').onclick=expJson;
  $('#impJson').onclick=function(){$('#fileInput').click()};
  $('#fileInput').onchange=function(){if(this.files&&this.files[0])impJson(this.files[0]);this.value=''};
  $('#wipe').onclick=function(){
    ask('删除全部 '+S.entries.length+' 笔记录？建议先导出备份。','全部删除',function(){
    S.entries=[];save();$('#setSheet').classList.remove('show');render();toast('已清空');
    });
  };
  $('#impBill').onclick=function(){$('#billInput').click()};
  $('#billInput').onchange=function(){if(this.files&&this.files[0])readBill(this.files[0]);this.value=''};
  $('#billCancel').onclick=function(){$('#billSheet').classList.remove('show')};
  $('#billSeg').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    billLedger=b.dataset.bill;
    billRows.forEach(function(r){if(r.lg!=='dup')r.lg=billLedger});
    画账单预览();
  });
  $('#billPreview').addEventListener('click',function(e){
    var row=e.target.closest('.imp-row');if(!row)return;
    轮换笔(+row.dataset.i);
  });
  $('#billGo').onclick=function(){commitBill()};
  $('#askYes').onclick=function(){var cb=askCb;askClose();if(cb)cb()};
  $('#askNo').onclick=askClose;
  $('#askSheet').addEventListener('click',function(e){if(e.target===$('#askSheet'))askClose()});
  $('#pickClose').onclick=function(){$('#pickSheet').classList.remove('show')};
  $('#pickSheet').addEventListener('click',function(e){
    if(e.target===$('#pickSheet')){$('#pickSheet').classList.remove('show');return}
    var it=e.target.closest('[data-pick]');if(it)applyPick(it.dataset.pick);
  });

  document.addEventListener('visibilitychange',function(){
    if(document.hidden)return;
    try{Snd.unlock()}catch(e){}
    rmCheck();
  });
  window.addEventListener('pointerdown',function(){Snd.unlock()},{once:true});

  /* 回前台/解锁后把声音解开：不解的话下一次点保存、到账都是哑的 */
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible')Snd.unlock();
  });

  window.addEventListener('error',function(e){
    try{toast('脚本出错：'+((e&&(e.message||e.error&&e.error.message))||'未知错误'))}catch(_e){}
  });
  load();render();urlPrefill();
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
})();
</script>
